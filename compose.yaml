services:
  longblog-automation:
    build: .
    container_name: longblog-automation
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python3", "/app/service/healthcheck.py"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
